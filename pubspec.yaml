name: app_version_manager
description: A CLI tool to manage version numbers in Flutter apps. Supports major, minor, patch, build, smart auto-increment, and revert operations on pubspec.yaml.
version: 2.0.0
repository: https://github.com/FakharAlyas119/app_version_manager

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  yaml: ^3.1.2
  yaml_edit: ^2.2.0
  path: ^1.8.0

dev_dependencies:
  lints: ^2.0.0
  test: ^1.21.0

executables:
  version_bump: app_version_manager
